<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="ring" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#1A1A1E"/>
      <stop offset="95%" stop-color="#33333A"/>
      <stop offset="100%" stop-color="#0F0F12"/>
    </radialGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E0E6"/>
      <stop offset="50%" stop-color="#888892"/>
      <stop offset="100%" stop-color="#F5F5FA"/>
    </linearGradient>
  </defs>
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#ring)" stroke="url(#silver)" stroke-width="4"/>
  <circle cx="100" cy="100" r="62" fill="none" stroke="url(#silver)" stroke-width="3"/>
  <!-- Bavarian Quadrants -->
  <path d="M 100 100 L 100 40 A 60 60 0 0 0 40 100 Z" fill="#FFFFFF"/>
  <path d="M 100 100 L 160 100 A 60 60 0 0 0 100 40 Z" fill="#0066B1"/>
  <path d="M 100 100 L 100 160 A 60 60 0 0 0 160 100 Z" fill="#FFFFFF"/>
  <path d="M 100 100 L 40 100 A 60 60 0 0 0 100 160 Z" fill="#0066B1"/>
  <circle cx="100" cy="100" r="60" fill="none" stroke="#25252A" stroke-width="1.5"/>
  <!-- BMW Text -->
  <text x="56" y="38" font-family="Noto Sans, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">B</text>
  <text x="100" y="24" font-family="Noto Sans, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">M</text>
  <text x="144" y="38" font-family="Noto Sans, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">W</text>
</svg>